services:
  - type: web
    name: nazore-live
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: HOST
        value: 0.0.0.0
      - key: FIREBASE_PROJECT_ID
        value: nazore-web-orl
      - key: FIREBASE_APP_IDS
        sync: false
      - key: NAZORE_LIVE_GRANTS_JSON
        sync: false
      - key: NAZORE_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-auth-verifier.json
